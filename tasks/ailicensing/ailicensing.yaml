category: pwn
points: 200
title: Чат-бот
author: rozetkinrobot
description: |
  <p>Разработана первая мультимодальная нейросетевая модель для CTF-соревнований. Обучение начали с лора.</p>

  <p>Нам удалось извлечь бинарный файл нейросети, но для запуска нужна лицензия.</p>
bullets:
    - <code>nc ailicensing.{{hostname}} 10560</code>
    - "Token: <code>{{token}}</code>"
generator: ../_scripts/kyzylborda-lib-generator
daemon:
  exec: ../_scripts/kyzylborda-lib-quarantine-daemon Dockerfile.controller app
  cwd: .
  socket: ./app.sock
  socket_type: tcp
  tcp_port: 10560
attachments_path: app/bin
secrets:
  flag: ugra_ailicensingiscoolbutbut_[a-z0-9]{12}
  seed: 0LGNhzQgslR1GJ93x6YtbNOPk9jMohtS
